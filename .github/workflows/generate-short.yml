name: Generate Short

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema del Short (déjalo vacío para que Gemini elija uno)"
        required: false
        type: string
      runs:
        description: "Cantidad de videos"
        required: false
        default: "1"
        type: string
      lang:
        description: "Idioma"
        required: false
        default: "es"
        type: choice
        options:
          - es
          - pt-BR
          - en
      voice:
        description: "Voz edge-tts (déjala por defecto para seleccionar una voz según el idioma)"
        required: false
        default: "en-US-AvaNeural"
        type: string
      upload:
        description: "Subir el resultado a YouTube"
        required: false
        default: false
        type: boolean
      privacy:
        description: "Privacidad de la subida"
        required: false
        default: "private"
        type: choice
        options:
          - private
          - unlisted
          - public

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py --check --lang "${{ inputs.lang || 'es' }}"

      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_RUNS: ${{ inputs.runs || '1' }}
          INPUT_LANG: ${{ inputs.lang || 'es' }}
          INPUT_VOICE: ${{ inputs.voice || 'en-US-AvaNeural' }}
          INPUT_UPLOAD: ${{ inputs.upload }}
          INPUT_PRIVACY: ${{ inputs.privacy || 'private' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          ARGS=(--runs "$INPUT_RUNS" --lang "$INPUT_LANG" --voice "$INPUT_VOICE")
          if [ -n "$INPUT_TOPIC" ]; then
            ARGS+=(--topic "$INPUT_TOPIC")
          fi
          if [ "$INPUT_UPLOAD" = "true" ]; then
            ARGS+=(--upload --privacy "$INPUT_PRIVACY")
          fi
          python main.py "${ARGS[@]}"

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: assets/final/*.mp4
          if-no-files-found: warn
          retention-days: 14
